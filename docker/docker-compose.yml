# =============================================================================
# AI Multi-Factor Stock Intelligence & Portfolio Decision-Support System
# docker/docker-compose.yml
#
# Phase 1 — Backend only.
#
# PostgreSQL and Redis services are defined below but commented out.
# They will be activated in Phase 2 (database layer) and Phase 11 (real-time).
# Do NOT enable them until the corresponding application code exists.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend — FastAPI application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ai_stock_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      LOG_JSON: "false"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

